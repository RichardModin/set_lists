{% extends "base.html" %}

{% block title %}Delete Event: {{ event.title }}{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2>Confirm Delete</h2>
  <p>Are you sure you want to delete the event "{{ event.title }}" on {{ event.date }}?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'core:event_detail' event.id %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
